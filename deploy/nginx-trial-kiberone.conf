# Конфиг nginx для it-kiber.ru
#
# Положить на сервер: /etc/nginx/sites-available/it-kiber.ru
# Активировать:      sudo ln -s /etc/nginx/sites-available/it-kiber.ru /etc/nginx/sites-enabled/
# Проверить:         sudo nginx -t
# Применить:         sudo systemctl reload nginx
#
# ВАЖНО: эту версию ставим ПЕРЕД запуском certbot.
# После `certbot --nginx -d it-kiber.ru` certbot сам добавит блок listen 443 ssl;
# и редирект http→https. Не пугайся, что после certbot файл выглядит иначе.

server {
    listen 80;
    listen [::]:80;
    server_name it-kiber.ru;

    # Размер загружаемых файлов (.sb3 до 25 МБ, видео до 50 МБ).
    client_max_body_size 60M;

    # Логи отдельно для этого сайта
    access_log /var/log/nginx/trial-kiberone.access.log;
    error_log  /var/log/nginx/trial-kiberone.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / polling status.json — короткий таймаут
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
